[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tarun-reliability"
version = "0.1.0"
description = "Replacement decisions from censored asset lifetimes"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "scipy==1.13.1"]
license = {file = "LICENSE"}

[project.scripts]
reliability = "reliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reliability*"]
